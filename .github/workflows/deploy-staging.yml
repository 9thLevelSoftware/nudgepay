name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  deployments: write

defaults:
  run:
    working-directory: nudgepay-app

jobs:
  candidate:
    name: seal successful main candidate
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      latest_migration: ${{ steps.metadata.outputs.latest_migration }}
      manifest_sha256: ${{ steps.metadata.outputs.manifest_sha256 }}
      staging_config_sha256: ${{ steps.metadata.outputs.staging_config_sha256 }}
      production_config_sha256: ${{ steps.metadata.outputs.production_config_sha256 }}
      staging_project_ref: ${{ steps.metadata.outputs.staging_project_ref }}
    steps:
      - name: Reject release workflow reruns
        working-directory: ${{ runner.temp }}
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo "Release artifacts are immutable. Re-run the upstream CI workflow to create a new staging workflow run instead of rerunning this release." >&2
            exit 1
          fi
      - name: Fetch the complete triggering CI job list
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/ci-jobs.json"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nudgepay-app/package-lock.json
      - name: Verify the trusted source and all eight CI jobs
        id: source
        run: >-
          node scripts/release-workflow.mjs verify-ci-trigger
          --event "$GITHUB_EVENT_PATH"
          --jobs "$RUNNER_TEMP/ci-jobs.json"
          --github-output "$GITHUB_OUTPUT"
      - name: Require staging artifact configuration
        env:
          STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
        run: |
          if [ -z "$STAGING_SUPABASE_URL" ]; then
            echo "Missing repository variable STAGING_SUPABASE_URL; staging was not uploaded." >&2
            exit 1
          fi
      - run: npm ci
      - name: Build and seal once
        env:
          EXPECTED_DEPLOY_SHA: ${{ steps.source.outputs.source_sha }}
          STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
        run: npm run release:prepare -- --artifact-dir "$RUNNER_TEMP/release-candidate"
      - name: Read sealed release identity
        id: metadata
        env:
          EXPECTED_DEPLOY_SHA: ${{ steps.source.outputs.source_sha }}
        run: >-
          node scripts/release-workflow.mjs metadata
          --artifact-dir "$RUNNER_TEMP/release-candidate"
          --expected-sha "$EXPECTED_DEPLOY_SHA"
          --output "$RUNNER_TEMP/release-metadata.json"
          --github-output "$GITHUB_OUTPUT"
      - name: Upload immutable sealed candidate
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nudgepay-release-${{ steps.metadata.outputs.source_sha }}
          path: ${{ runner.temp }}/release-candidate
          if-no-files-found: error
          overwrite: false
          include-hidden-files: true
          retention-days: 90
      - name: Record candidate identity
        env:
          SOURCE_SHA: ${{ steps.metadata.outputs.source_sha }}
          MANIFEST_SHA: ${{ steps.metadata.outputs.manifest_sha256 }}
          STAGING_CONFIG_SHA: ${{ steps.metadata.outputs.staging_config_sha256 }}
          PRODUCTION_CONFIG_SHA: ${{ steps.metadata.outputs.production_config_sha256 }}
          ACTIONS_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ACTIONS_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          {
            echo "### Sealed release candidate"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Manifest: \`$MANIFEST_SHA\`"
            echo "- Staging config: \`$STAGING_CONFIG_SHA\`"
            echo "- Production config: \`$PRODUCTION_CONFIG_SHA\`"
            echo "- Actions artifact: \`$ACTIONS_ARTIFACT_ID\` / \`$ACTIONS_ARTIFACT_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  staging:
    name: deploy and verify staging bootstrap
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: https://nudgepay-app-staging.dasblueeyeddevil.workers.dev
    concurrency:
      group: nudgepay-worker-release
      cancel-in-progress: false
    steps:
      - name: Reject staging job reruns
        working-directory: ${{ runner.temp }}
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo "Release artifacts are immutable. Re-run the upstream CI workflow to create a new staging workflow run instead of rerunning this release." >&2
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.candidate.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nudgepay-app/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nudgepay-release-${{ needs.candidate.outputs.source_sha }}
          path: ${{ runner.temp }}/release-candidate
      - name: Require staging credentials before any upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_ACCESS_TOKEN; do
            if [ -z "${!name}" ]; then echo "Missing staging environment secret $name; staging was not uploaded." >&2; exit 1; fi
          done
      - name: Verify staging environment protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/staging" > "$RUNNER_TEMP/environment.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/staging/deployment-branch-policies?per_page=100" > "$RUNNER_TEMP/environment-policies.json"
          node scripts/release-workflow.mjs verify-environment --environment "$RUNNER_TEMP/environment.json" --policies "$RUNNER_TEMP/environment-policies.json" --expected-name staging --require-reviewer false
      - name: Verify downloaded artifact identity
        run: >-
          node scripts/release-workflow.mjs metadata
          --artifact-dir "$RUNNER_TEMP/release-candidate"
          --expected-sha "${{ needs.candidate.outputs.source_sha }}"
          --expected-manifest-sha "${{ needs.candidate.outputs.manifest_sha256 }}"
          --expected-staging-config-sha "${{ needs.candidate.outputs.staging_config_sha256 }}"
          --expected-production-config-sha "${{ needs.candidate.outputs.production_config_sha256 }}"
      - name: Verify staging migration ledger before upload
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >-
          npm run release:predeploy --
          --environment staging
          --artifact-dir "$RUNNER_TEMP/release-candidate"
          --expected-sha "${{ needs.candidate.outputs.source_sha }}"
          --expected-migration "${{ needs.candidate.outputs.latest_migration }}"
          --expected-manifest-sha "${{ needs.candidate.outputs.manifest_sha256 }}"
          --expected-config-sha "${{ needs.candidate.outputs.staging_config_sha256 }}"
      - name: Record prior staging version for manual rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          node scripts/record-deployment-attempt.mjs
          --environment staging
          --artifact-dir "$RUNNER_TEMP/release-candidate"
          --evidence-dir "$RUNNER_TEMP/staging-evidence/attempts"
          --expected-sha "${{ needs.candidate.outputs.source_sha }}"
          --expected-migration "${{ needs.candidate.outputs.latest_migration }}"
          --expected-manifest-sha "${{ needs.candidate.outputs.manifest_sha256 }}"
          --expected-config-sha "${{ needs.candidate.outputs.staging_config_sha256 }}"
          --attempt-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Reject a stale candidate immediately before upload
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.candidate.outputs.source_sha }}
        run: |
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          node scripts/release-workflow.mjs verify-current-main --expected-sha "$EXPECTED_SHA" --current-sha "$CURRENT_SHA"
      - name: Upload sealed candidate to staging
        env:
          EXPECTED_DEPLOY_SHA: ${{ needs.candidate.outputs.source_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npm run deploy:staging --
          --qualification bootstrap
          --artifact-dir "$RUNNER_TEMP/release-candidate"
          --receipt-dir "$RUNNER_TEMP/staging-evidence"
          --expected-manifest-sha "${{ needs.candidate.outputs.manifest_sha256 }}"
          --expected-config-sha "${{ needs.candidate.outputs.staging_config_sha256 }}"
      - name: Locate staging receipt
        id: receipt
        run: >-
          node scripts/release-workflow.mjs locate-receipt
          --directory "$RUNNER_TEMP/staging-evidence"
          --environment staging
          --expected-sha "${{ needs.candidate.outputs.source_sha }}"
          --expected-manifest-sha "${{ needs.candidate.outputs.manifest_sha256 }}"
          --expected-config-sha "${{ needs.candidate.outputs.staging_config_sha256 }}"
          --github-output "$GITHUB_OUTPUT"
      - name: Verify staged deployment and record pending qualification
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >-
          node scripts/release-qualifier.mjs
          --environment staging
          --qualification bootstrap
          --artifact-dir "$RUNNER_TEMP/release-candidate"
          --receipt "${{ steps.receipt.outputs.receipt_path }}"
          --base-url "https://nudgepay-app-staging.dasblueeyeddevil.workers.dev"
          --expected-sha "${{ needs.candidate.outputs.source_sha }}"
          --expected-migration "${{ needs.candidate.outputs.latest_migration }}"
          --expected-manifest-sha "${{ needs.candidate.outputs.manifest_sha256 }}"
          --expected-config-sha "${{ needs.candidate.outputs.staging_config_sha256 }}"
          > "$RUNNER_TEMP/staging-evidence/qualification.json"
      - name: Retain staging receipt, qualification, and rollback identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nudgepay-staging-evidence-${{ needs.candidate.outputs.source_sha }}
          path: ${{ runner.temp }}/staging-evidence
          if-no-files-found: error
          overwrite: false
          retention-days: 90
      - name: Record staging bootstrap limits
        if: success()
        env:
          RECEIPT_SHA: ${{ steps.receipt.outputs.receipt_sha256 }}
        run: |
          {
            echo "### Staging deployed; production qualification pending"
            echo "- Receipt: \`$RECEIPT_SHA\`"
            echo "- Verified: sealed artifact identity, exact Worker deployment, sealed Supabase target, and migration parity."
            echo "- Pending: provider secrets, /readyz configuration, /monitorz steady-state health, provider integration, and operator gates."
            echo "- Production remains a disabled, explicit promotion workflow."
          } >> "$GITHUB_STEP_SUMMARY"
