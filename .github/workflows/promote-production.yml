name: Promote production

on:
  workflow_dispatch:
    inputs:
      operator_attests_remaining_gates:
        description: I attest the seven remaining release gates have current evidence for this SHA
        required: true
        default: false
        type: boolean
      operator_evidence_reference:
        description: External evidence or change-control reference for the seven remaining gates
        required: true
        type: string

permissions:
  actions: read
  contents: read
  deployments: write

defaults:
  run:
    working-directory: nudgepay-app

jobs:
  authorize:
    name: authorize qualified artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      staging_run_id: ${{ steps.select.outputs.staging_run_id }}
      source_sha: ${{ steps.select.outputs.source_sha }}
    steps:
      - name: Require production enablement and operator attestation
        working-directory: ${{ runner.temp }}
        env:
          PRODUCTION_PROMOTION_ENABLED: ${{ vars.PRODUCTION_PROMOTION_ENABLED }}
          OPERATOR_ATTESTATION: ${{ inputs.operator_attests_remaining_gates }}
          EVIDENCE_REFERENCE: ${{ inputs.operator_evidence_reference }}
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then echo "Production promotion attempts are immutable. Dispatch a new workflow after reviewing the retained attempt evidence." >&2; exit 1; fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "Production workflow must be dispatched from refs/heads/main." >&2; exit 1; fi
          if [ "$PRODUCTION_PROMOTION_ENABLED" != "true" ]; then echo "Repository variable PRODUCTION_PROMOTION_ENABLED is absent or not true; production was not uploaded." >&2; exit 1; fi
          if [ "$OPERATOR_ATTESTATION" != "true" ]; then echo "Operator attestation for the seven remaining gates is required." >&2; exit 1; fi
          if [ -z "$EVIDENCE_REFERENCE" ] || [ "${#EVIDENCE_REFERENCE}" -gt 200 ]; then echo "A concise operator evidence reference is required." >&2; exit 1; fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nudgepay-app/package-lock.json
      - run: npm ci
      - name: Select latest successful staging run for current main
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-staging.yml/runs?branch=main&status=success&per_page=100" > "$RUNNER_TEMP/staging-runs.json"
          node scripts/release-workflow.mjs select-staging-run \
            --runs "$RUNNER_TEMP/staging-runs.json" \
            --repository "$GITHUB_REPOSITORY" \
            --current-sha "$CURRENT_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - name: Verify current main and successful staging workflow
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RUN_ID: ${{ steps.select.outputs.staging_run_id }}
          EXPECTED_SHA: ${{ steps.select.outputs.source_sha }}
        run: |
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          node scripts/release-workflow.mjs verify-current-main --expected-sha "$EXPECTED_SHA" --current-sha "$CURRENT_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_RUN_ID" > "$RUNNER_TEMP/staging-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/staging-jobs.json"
          node scripts/release-workflow.mjs verify-staging-run --run "$RUNNER_TEMP/staging-run.json" --jobs "$RUNNER_TEMP/staging-jobs.json" --repository "$GITHUB_REPOSITORY"
      - name: Verify production environment configuration before approval job
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OWNER: ${{ vars.RELEASE_OWNER }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/production" > "$RUNNER_TEMP/environment.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/production/deployment-branch-policies?per_page=100" > "$RUNNER_TEMP/environment-policies.json"
          node scripts/release-workflow.mjs verify-environment --environment "$RUNNER_TEMP/environment.json" --policies "$RUNNER_TEMP/environment-policies.json" --expected-name production --require-reviewer true --release-owner "$RELEASE_OWNER"

  requalify-staging:
    name: requalify retained staging artifact
    needs: authorize
    outputs:
      staging_qualification_sha256: ${{ steps.qualify.outputs.qualification_sha256 }}
      manifest_sha256: ${{ steps.metadata.outputs.manifest_sha256 }}
      staging_config_sha256: ${{ steps.metadata.outputs.staging_config_sha256 }}
      production_config_sha256: ${{ steps.metadata.outputs.production_config_sha256 }}
      staging_receipt_sha256: ${{ steps.receipt.outputs.receipt_sha256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://nudgepay-app-staging.dasblueeyeddevil.workers.dev
    steps:
      - name: Reject staging requalification reruns
        working-directory: ${{ runner.temp }}
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo "Production promotion attempts are immutable. Dispatch a new workflow after reviewing the retained attempt evidence." >&2
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nudgepay-app/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nudgepay-release-${{ needs.authorize.outputs.source_sha }}
          path: ${{ runner.temp }}/release-candidate
          run-id: ${{ needs.authorize.outputs.staging_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nudgepay-staging-evidence-${{ needs.authorize.outputs.source_sha }}
          path: ${{ runner.temp }}/staging-evidence
          run-id: ${{ needs.authorize.outputs.staging_run_id }}
          github-token: ${{ github.token }}
      - name: Verify retained artifact and receipt
        id: metadata
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: |
          node scripts/release-workflow.mjs metadata --artifact-dir "$RUNNER_TEMP/release-candidate" --expected-sha "$SOURCE_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Verify retained staging receipt
        id: receipt
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: |
          node scripts/release-workflow.mjs locate-receipt --directory "$RUNNER_TEMP/staging-evidence" --environment staging --expected-sha "$SOURCE_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Require staging credentials for requalification
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_ACCESS_TOKEN MONITOR_TOKEN; do
            if [ -z "${!name}" ]; then echo "Missing staging environment credential $name; production was not uploaded." >&2; exit 1; fi
          done
      - name: Requalify staging immediately before production approval
        id: qualify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/staging-requalification"
          node scripts/release-qualifier.mjs \
          --environment staging \
          --qualification strict \
          --artifact-dir "$RUNNER_TEMP/release-candidate" \
          --receipt "${{ steps.receipt.outputs.receipt_path }}" \
          --base-url "https://nudgepay-app-staging.dasblueeyeddevil.workers.dev" \
          --expected-sha "${{ needs.authorize.outputs.source_sha }}" \
          --expected-migration "${{ steps.metadata.outputs.latest_migration }}" \
          --expected-manifest-sha "${{ steps.metadata.outputs.manifest_sha256 }}" \
          --expected-config-sha "${{ steps.metadata.outputs.staging_config_sha256 }}" \
          > "$RUNNER_TEMP/staging-requalification/qualification.json"
          QUALIFICATION_SHA256="$(sha256sum "$RUNNER_TEMP/staging-requalification/qualification.json" | cut -d' ' -f1)"
          echo "qualification_sha256=$QUALIFICATION_SHA256" >> "$GITHUB_OUTPUT"
      - name: Retain strict staging requalification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nudgepay-staging-requalification-${{ needs.authorize.outputs.source_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/staging-requalification
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  production:
    name: approve, deploy, and qualify production
    needs: [authorize, requalify-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://nudgepay.9thlevelsoftware.com
    concurrency:
      group: nudgepay-worker-release
      cancel-in-progress: false
    steps:
      - name: Reject production deployment reruns
        working-directory: ${{ runner.temp }}
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo "Production promotion attempts are immutable. Dispatch a new workflow after reviewing the retained attempt evidence." >&2
            exit 1
          fi
      - name: Retain promotion authorization
        working-directory: ${{ runner.temp }}
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
          MANIFEST_SHA: ${{ needs['requalify-staging'].outputs.manifest_sha256 }}
          STAGING_CONFIG_SHA: ${{ needs['requalify-staging'].outputs.staging_config_sha256 }}
          PRODUCTION_CONFIG_SHA: ${{ needs['requalify-staging'].outputs.production_config_sha256 }}
          STAGING_RECEIPT_SHA: ${{ needs['requalify-staging'].outputs.staging_receipt_sha256 }}
          STAGING_QUALIFICATION_SHA: ${{ needs['requalify-staging'].outputs.staging_qualification_sha256 }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { mkdirSync, readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          const reference = event.inputs?.operator_evidence_reference?.trim();
          const attested = event.inputs?.operator_attests_remaining_gates === true || event.inputs?.operator_attests_remaining_gates === "true";
          const workflowRunId = Number(process.env.GITHUB_RUN_ID);
          const runAttempt = Number(process.env.GITHUB_RUN_ATTEMPT);
          if (!attested || !reference || reference.length > 200 || !Number.isSafeInteger(workflowRunId) || !Number.isSafeInteger(runAttempt) || !/^[a-f0-9]{64}$/.test(process.env.STAGING_QUALIFICATION_SHA ?? "")) throw new Error("Invalid promotion authorization evidence");
          const authorization = { schemaVersion: 1, recordedAt: new Date().toISOString(), actor: process.env.GITHUB_ACTOR, repository: process.env.GITHUB_REPOSITORY, workflowRunId, runAttempt, sourceSha: process.env.SOURCE_SHA, manifestSha256: process.env.MANIFEST_SHA, stagingConfigSha256: process.env.STAGING_CONFIG_SHA, productionConfigSha256: process.env.PRODUCTION_CONFIG_SHA, stagingReceiptSha256: process.env.STAGING_RECEIPT_SHA, stagingQualificationSha256: process.env.STAGING_QUALIFICATION_SHA, operatorAttestsRemainingGates: true, operatorEvidenceReference: reference };
          authorization.authorizationSha256 = createHash("sha256").update(JSON.stringify(authorization)).digest("hex");
          const directory = join(process.env.RUNNER_TEMP, "production-evidence");
          mkdirSync(directory, { recursive: true });
          writeFileSync(join(directory, "promotion-authorization.json"), `${JSON.stringify(authorization, null, 2)}\n`, { flag: "wx" });
          NODE
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nudgepay-app/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nudgepay-release-${{ needs.authorize.outputs.source_sha }}
          path: ${{ runner.temp }}/release-candidate
          run-id: ${{ needs.authorize.outputs.staging_run_id }}
          github-token: ${{ github.token }}
      - name: Verify retained production artifact identity
        id: metadata
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
          MANIFEST_SHA: ${{ needs['requalify-staging'].outputs.manifest_sha256 }}
          STAGING_CONFIG_SHA: ${{ needs['requalify-staging'].outputs.staging_config_sha256 }}
          PRODUCTION_CONFIG_SHA: ${{ needs['requalify-staging'].outputs.production_config_sha256 }}
        run: >-
          node scripts/release-workflow.mjs metadata
          --artifact-dir "$RUNNER_TEMP/release-candidate"
          --expected-sha "$SOURCE_SHA"
          --expected-manifest-sha "$MANIFEST_SHA"
          --expected-staging-config-sha "$STAGING_CONFIG_SHA"
          --expected-production-config-sha "$PRODUCTION_CONFIG_SHA"
          --github-output "$GITHUB_OUTPUT"
      - name: Require production credentials before any upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_ACCESS_TOKEN MONITOR_TOKEN; do
            if [ -z "${!name}" ]; then echo "Missing production environment secret $name; production was not uploaded." >&2; exit 1; fi
          done
      - name: Reverify production environment protection
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OWNER: ${{ vars.RELEASE_OWNER }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/production" > "$RUNNER_TEMP/environment.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/production/deployment-branch-policies?per_page=100" > "$RUNNER_TEMP/environment-policies.json"
          node scripts/release-workflow.mjs verify-environment --environment "$RUNNER_TEMP/environment.json" --policies "$RUNNER_TEMP/environment-policies.json" --expected-name production --require-reviewer true --release-owner "$RELEASE_OWNER"
      - name: Verify production migration ledger before upload
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
          MANIFEST_SHA: ${{ needs['requalify-staging'].outputs.manifest_sha256 }}
          PRODUCTION_CONFIG_SHA: ${{ needs['requalify-staging'].outputs.production_config_sha256 }}
        run: >-
          npm run release:predeploy --
          --environment production
          --artifact-dir "$RUNNER_TEMP/release-candidate"
          --expected-sha "$SOURCE_SHA"
          --expected-migration "${{ steps.metadata.outputs.latest_migration }}"
          --expected-manifest-sha "$MANIFEST_SHA"
          --expected-config-sha "$PRODUCTION_CONFIG_SHA"
      - name: Record prior production version for manual rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
          MANIFEST_SHA: ${{ needs['requalify-staging'].outputs.manifest_sha256 }}
          PRODUCTION_CONFIG_SHA: ${{ needs['requalify-staging'].outputs.production_config_sha256 }}
        run: >-
          node scripts/record-deployment-attempt.mjs
          --environment production
          --artifact-dir "$RUNNER_TEMP/release-candidate"
          --evidence-dir "$RUNNER_TEMP/production-evidence/attempts"
          --expected-sha "$SOURCE_SHA"
          --expected-migration "${{ steps.metadata.outputs.latest_migration }}"
          --expected-manifest-sha "$MANIFEST_SHA"
          --expected-config-sha "$PRODUCTION_CONFIG_SHA"
          --attempt-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Reject a stale candidate immediately before production upload
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: |
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          node scripts/release-workflow.mjs verify-current-main --expected-sha "$EXPECTED_SHA" --current-sha "$CURRENT_SHA"
      - name: Upload same sealed candidate to production
        env:
          EXPECTED_DEPLOY_SHA: ${{ needs.authorize.outputs.source_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MANIFEST_SHA: ${{ needs['requalify-staging'].outputs.manifest_sha256 }}
          PRODUCTION_CONFIG_SHA: ${{ needs['requalify-staging'].outputs.production_config_sha256 }}
        run: >-
          npm run deploy --
          --qualification strict
          --artifact-dir "$RUNNER_TEMP/release-candidate"
          --receipt-dir "$RUNNER_TEMP/production-evidence"
          --expected-manifest-sha "$MANIFEST_SHA"
          --expected-config-sha "$PRODUCTION_CONFIG_SHA"
      - name: Locate production receipt
        id: receipt
        run: >-
          node scripts/release-workflow.mjs locate-receipt
          --directory "$RUNNER_TEMP/production-evidence"
          --environment production
          --expected-sha "${{ needs.authorize.outputs.source_sha }}"
          --expected-manifest-sha "${{ needs['requalify-staging'].outputs.manifest_sha256 }}"
          --expected-config-sha "${{ needs['requalify-staging'].outputs.production_config_sha256 }}"
          --github-output "$GITHUB_OUTPUT"
      - name: Qualify production configuration and runtime status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
          MANIFEST_SHA: ${{ needs['requalify-staging'].outputs.manifest_sha256 }}
          PRODUCTION_CONFIG_SHA: ${{ needs['requalify-staging'].outputs.production_config_sha256 }}
        run: >-
          node scripts/release-qualifier.mjs
          --environment production
          --qualification strict
          --artifact-dir "$RUNNER_TEMP/release-candidate"
          --receipt "${{ steps.receipt.outputs.receipt_path }}"
          --base-url "https://nudgepay.9thlevelsoftware.com"
          --expected-sha "$SOURCE_SHA"
          --expected-migration "${{ steps.metadata.outputs.latest_migration }}"
          --expected-manifest-sha "$MANIFEST_SHA"
          --expected-config-sha "$PRODUCTION_CONFIG_SHA"
          > "$RUNNER_TEMP/production-evidence/qualification.json"
      - name: Retain production receipt, qualification, and rollback identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nudgepay-production-evidence-${{ needs.authorize.outputs.source_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-evidence
          if-no-files-found: error
          overwrite: false
          retention-days: 90
