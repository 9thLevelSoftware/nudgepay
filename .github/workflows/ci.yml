name: CI

# PR gate is `typecheck + unit tests` (`npm run test:unit`). A green PR
# does not prove RLS, QBO, or Twilio — those suites import `./helpers`
# and are excluded from unit CI. Full `npm test` against local Supabase
# (or the non-PR `supabase integration` job) is the RLS proof. No
# coverage thresholds. No auth rate-limit job.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC nightly

defaults:
  run:
    working-directory: nudgepay-app

jobs:
  unit:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nudgepay-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  integration:
    name: supabase integration
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nudgepay-app/package-lock.json
      - run: npm ci
      - name: Raise GoTrue sign-in limit for the suite
        run: sed -i 's/^sign_in_sign_ups = .*/sign_in_sign_ups = 10000/' supabase/config.toml && grep -q '^sign_in_sign_ups = 10000$' supabase/config.toml
      - run: npx supabase start
      - run: cp .env.test.example .env.test
      - run: npx vitest run
      - run: npx supabase stop
        if: always()
