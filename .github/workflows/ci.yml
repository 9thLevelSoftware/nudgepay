name: CI

# PR candidate jobs (hosted required-check configuration is verified separately):
#   secret scan           — whole repository working tree + every commit in the PR
#   CodeQL                 — JavaScript/TypeScript static analysis
#   typecheck + unit tests — no Docker; excludes files that import ./helpers
#   production check       — tsc + react-router build + wrangler deploy --dry-run
#   supabase integration   — fresh `supabase start` (applies 0001..N) + `npx vitest run`
#                             (RLS, migrations, QBO/Twilio fakes). A green PR is not
#                             real-provider or staging proof.
#   browser smoke          — Playwright against /healthz, /login, /signup
#   npm audit (production) — `npm audit --omit=dev` on nudgepay-app
#   authenticated browser flows — isolated local Supabase, Chromium desktop
# No coverage thresholds. No auth rate-limit job.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC nightly

permissions:
  contents: read

defaults:
  run:
    working-directory: nudgepay-app

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Scan the whole working tree for secrets
        working-directory: .
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo zricethezav/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 dir . --config nudgepay-app/.gitleaks.toml --redact --no-banner
      - name: Scan every commit in the pull request
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo zricethezav/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 git . --config nudgepay-app/.gitleaks.toml --log-opts="$BASE_SHA..$HEAD_SHA" --redact --no-banner

  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@0fa1882f994fbd81a47ab0804f93354f5ea40147 # v3.28.17
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@0fa1882f994fbd81a47ab0804f93354f5ea40147 # v3.28.17

  unit:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nudgepay-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  check:
    name: production check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nudgepay-app/package-lock.json
      - run: npm ci
      - run: npm run check

  integration:
    name: supabase integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nudgepay-app/package-lock.json
      - run: npm ci
      - name: Raise GoTrue sign-in limit for the suite
        run: sed -i 's/^sign_in_sign_ups = .*/sign_in_sign_ups = 10000/' supabase/config.toml && grep -q '^sign_in_sign_ups = 10000$' supabase/config.toml
      - run: npx supabase start
      - run: cp .env.test.example .env.test
      - run: npx vitest run
      - run: npx supabase stop
        if: always()

  audit:
    name: npm audit (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nudgepay-app/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev

  e2e:
    name: browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nudgepay-app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true

  authenticated-e2e:
    name: authenticated browser flows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nudgepay-app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node e2e/authenticated/run.mjs --project=chromium-desktop
        env:
          CI: true
      - name: Upload authenticated browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: authenticated-browser-failure-${{ github.run_attempt }}
          path: |
            /tmp/nudgepay-playwright/authenticated/**/*.png
            /tmp/NudgePay/e2e-evidence/**/*.png
            !/tmp/nudgepay-playwright/authenticated/**/trace.zip
            !/tmp/nudgepay-playwright/authenticated/**/*.webm
            !/tmp/nudgepay-playwright/authenticated/**/network*
            !/tmp/nudgepay-playwright/authenticated/**/raw-console*
          if-no-files-found: ignore
          retention-days: 7

  authenticated-e2e-full:
    name: authenticated cross-browser flows
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nudgepay-app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node e2e/authenticated/run.mjs
        env:
          CI: true
      - name: Upload cross-browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: authenticated-cross-browser-failure-${{ github.run_attempt }}
          path: |
            /tmp/nudgepay-playwright/authenticated/**/*.png
            /tmp/NudgePay/e2e-evidence/**/*.png
            !/tmp/nudgepay-playwright/authenticated/**/trace.zip
            !/tmp/nudgepay-playwright/authenticated/**/*.webm
            !/tmp/nudgepay-playwright/authenticated/**/network*
            !/tmp/nudgepay-playwright/authenticated/**/raw-console*
          if-no-files-found: ignore
          retention-days: 7
