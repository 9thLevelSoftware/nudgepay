name: CI

# PR required jobs:
#   typecheck + unit tests — no Docker; excludes files that import ./helpers
#   production check       — tsc + react-router build + wrangler deploy --dry-run
#   supabase integration   — fresh `supabase start` (applies 0001..N) + `npx vitest run`
#                             (RLS, migrations, QBO/Twilio fakes). A green PR is not
#                             real-provider or staging proof.
#   browser smoke          — Playwright against /healthz, /login, /signup
# No coverage thresholds. No auth rate-limit job.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC nightly

defaults:
  run:
    working-directory: nudgepay-app

jobs:
  unit:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nudgepay-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  check:
    name: production check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nudgepay-app/package-lock.json
      - run: npm ci
      - run: npm run check

  integration:
    name: supabase integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nudgepay-app/package-lock.json
      - run: npm ci
      - name: Raise GoTrue sign-in limit for the suite
        run: sed -i 's/^sign_in_sign_ups = .*/sign_in_sign_ups = 10000/' supabase/config.toml && grep -q '^sign_in_sign_ups = 10000$' supabase/config.toml
      - run: npx supabase start
      - run: cp .env.test.example .env.test
      - run: npx vitest run
      - run: npx supabase stop
        if: always()

  e2e:
    name: browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nudgepay-app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
