# Cloudflare Workers Builds triggers are disabled. Releases use the manual,
# explicit sealed-artifact flow documented in nudgepay-app/README.md and
# docs/pilot-ops.md. Without this file, an accidental root `npx wrangler deploy`
# can auto-init a static site from `netlify/` and overwrite the live SSR Worker.
#
# Keep all production and preview triggers disabled until a reviewed CI design
# can retrieve the exact retained artifact and preserve its manifest/config/
# Worker-version receipts. This build hook intentionally keeps direct root
# Wrangler uploads fail-closed; it cannot perform post-upload redaction and
# active-version verification.

name = "nudgepay-app"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
main = "nudgepay-app/build/server/index.js"
# Production is available only through its custom domain.
workers_dev = false

[vars]
SUPABASE_URL = "https://epjumsnmpvilgasycpau.supabase.co"
QBO_SANDBOX = "false"
AUTH_RATE_LIMIT_REQUIRED = "true"
CSP_MODE = "report-only"

[[routes]]
pattern = "nudgepay.9thlevelsoftware.com"
custom_domain = true

[triggers]
crons = ["*/5 * * * *", "*/30 * * * *", "0 * * * *"]

[placement]
mode = "smart"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
persist = true

[[ratelimits]]
name = "AUTH_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[assets]
directory = "nudgepay-app/build/client"

[build]
command = "node scripts/reject-direct-worker-deploy.mjs"
cwd = "nudgepay-app"
