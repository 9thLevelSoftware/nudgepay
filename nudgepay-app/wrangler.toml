name = "nudgepay-app"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
main = "./workers/app.ts"
# Production is available only through its custom domain. This prevents the
# account-wide workers.dev hostname from becoming an alternate public ingress.
workers_dev = false

[vars]
# Non-secret defaults for the live Worker (`npm run deploy`). Local
# `wrangler dev` / `npm run dev` override these from `.dev.vars`.
SUPABASE_URL = "https://epjumsnmpvilgasycpau.supabase.co"
QBO_SANDBOX = "false"
AUTH_RATE_LIMIT_REQUIRED = "true"
CSP_MODE = "report-only"
# Optional non-secret flags (not bindings; unset here, set in vars when enabling):
#   RESEND_ALLOWED_FROM     comma-separated verified From addresses
#   SMS_REQUIRE_INVENTORY   "true" requires sms_sender_inventory rows at send
# Secrets (wrangler secret put): SUPABASE_ANON_KEY, SUPABASE_SERVICE_KEY,
# QBO_CLIENT_ID, QBO_CLIENT_SECRET, QBO_REDIRECT_URI, QBO_ENCRYPTION_KEY,
# QBO_WEBHOOK_VERIFIER_TOKEN,
# TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_MESSAGING_SERVICE_SID (or TWILIO_FROM_NUMBER),
# TWILIO_PUBLIC_BASE_URL,
# RESEND_API_KEY, RESEND_WEBHOOK_SECRET, RESEND_ALLOWED_FROM, UNSUBSCRIBE_SECRET, APP_PUBLIC_BASE_URL
# RESEND_ALLOWED_FROM is a comma-separated list of verified From addresses
# (`email` any workspace, or `orgId:email` bound to that workspace); email
# enable fails closed when it is unset or empty.

[[routes]]
pattern = "nudgepay.9thlevelsoftware.com"
custom_domain = true

[triggers]
# Provider-attempt monitor every 5 min, CDC catch-up every 30 min, and hourly digest gate / retention purge
# (digest fires per-org once local time reaches digest_hour_local;
# see digest-cron.server.ts and retention-cron.server.ts).
crons = ["*/5 * * * *", "*/30 * * * *", "0 * * * *"]

# Run the Worker near the origin (Supabase Oregon) instead of the user's
# edge. Loaders make several PostgREST round trips; Smart Placement moves
# compute next to those subrequests once it has enough traffic.
[placement]
mode = "smart"

# Workers Logs (no Sentry DSN). Dashboard: Workers & Pages → nudgepay-app → Observability.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
persist = true

# Auth POST limiter (login / signup / forgot-password). 20 / 60s / IP.
# namespace_id is a string up to 32 chars, unique per account (Cloudflare examples use "1001").
# Ratelimits are NOT inherited by named environments — duplicate under production.
[[ratelimits]]
name = "AUTH_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# --- Production environment ---------------------------------------------------
# Deploy with: npm run deploy
# Non-secret production vars (secrets are set separately via `wrangler secret put`).
[env.production]
# Explicitly reuse the live Worker name. Without this, Wrangler legacy
# environments target a separate `nudgepay-app-production` Worker.
name = "nudgepay-app"
workers_dev = false

[env.production.vars]
SUPABASE_URL = "https://epjumsnmpvilgasycpau.supabase.co"
QBO_SANDBOX = "false"   # production QBO: gates ONLY the Data API base URL
AUTH_RATE_LIMIT_REQUIRED = "true"  # fail closed if the AUTH_RATE_LIMIT binding is missing
CSP_MODE = "report-only"
# Optional non-secret flags (not bindings; set when enabling the feature):
#   RESEND_ALLOWED_FROM     comma-separated verified From addresses; empty/unset disables email
#   SMS_REQUIRE_INVENTORY = "true"

# [env.production.triggers] mirrors the top-level crons.
[env.production.triggers]
crons = ["*/5 * * * *", "*/30 * * * *", "0 * * * *"]

[env.production.placement]
mode = "smart"

[[env.production.routes]]
pattern = "nudgepay.9thlevelsoftware.com"
custom_domain = true

[env.production.observability]
enabled = true
head_sampling_rate = 1

[env.production.observability.logs]
enabled = true
invocation_logs = true
persist = true

[[env.production.ratelimits]]
name = "AUTH_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Secrets required in production (set each: `npx wrangler secret put <NAME> --env production`):
#   SUPABASE_ANON_KEY            Supabase anon/publishable key
#   SUPABASE_SERVICE_KEY         Supabase service-role key (server-only)
#   QBO_CLIENT_ID                Intuit PRODUCTION app client id
#   QBO_CLIENT_SECRET            Intuit PRODUCTION app client secret
#   QBO_REDIRECT_URI             ${APP_BASE_URL}/auth/qbo/callback  (must match Intuit app Redirect URI exactly)
#   QBO_ENCRYPTION_KEY           base64 of 32 random bytes (AES-256) — same key family as other envs; never rotate without re-encrypting
#   QBO_WEBHOOK_VERIFIER_TOKEN   Intuit webhook verifier token (from the production app's Webhooks page)
#   TWILIO_ACCOUNT_SID           Twilio account SID
#   TWILIO_AUTH_TOKEN            Twilio auth token
#   TWILIO_MESSAGING_SERVICE_SID Production Messaging Service SID (preferred sender)  -- or --
#   TWILIO_FROM_NUMBER           E.164 sender number (fallback if no Messaging Service)
#   TWILIO_PUBLIC_BASE_URL       ${APP_BASE_URL}  (origin Twilio uses for signature validation + StatusCallback)
#   RESEND_API_KEY               Resend send key (for customer + team alert emails)
#   RESEND_WEBHOOK_SECRET        Resend webhook signing secret
#   RESEND_ALLOWED_FROM          comma-separated verified From addresses (`email` or `orgId:email`; required to enable email)
#   UNSUBSCRIBE_SECRET           HMAC key for CAN-SPAM unsubscribe tokens
#   APP_PUBLIC_BASE_URL          ${APP_BASE_URL}  (public origin for unsubscribe links + alert deep links)
#   OPERATOR_ALERT_WEBHOOK       optional HTTPS URL; POST JSON when a scheduled handler throws
#   MONITOR_TOKEN                32+ character bearer token required by GET /monitorz
#   STRIPE_SECRET_KEY            Stripe secret for agency SaaS billing (not debtor payments)
#   STRIPE_WEBHOOK_SECRET        Stripe webhook signing secret
#   STRIPE_PRICE_ID              Stripe Price id for the NudgePay workspace subscription
# DEPLOY GATE: Connect/Refresh/Disconnect degrade via getQboEnvOrNull (no 500) until
# QBO secrets are set. getTwilioEnv still throws on send/webhook paths until Twilio
# secrets are set. Email/alert secrets are optional — getEmailEnvOrNull returns null.

# --- Staging environment ------------------------------------------------------
# Deploy with: npm run deploy:staging
# Secrets: the same list as production, via `npx wrangler secret put <NAME> --env staging`.
# QBO_SANDBOX stays true. `npm run deploy:staging` requires a concrete
# STAGING_SUPABASE_URL environment variable and refuses the production URL.
# Operators must still verify that the supplied project is isolated. workers.dev hostname is
# nudgepay-app-staging.<account>.workers.dev until a staging domain is attached.
[env.staging]
name = "nudgepay-app-staging"
workers_dev = true

[env.staging.vars]
QBO_SANDBOX = "true"
AUTH_RATE_LIMIT_REQUIRED = "true"
CSP_MODE = "report-only"

[env.staging.triggers]
crons = ["*/5 * * * *", "*/30 * * * *", "0 * * * *"]

[env.staging.placement]
mode = "smart"

[env.staging.observability]
enabled = true
head_sampling_rate = 1

[env.staging.observability.logs]
enabled = true
invocation_logs = true
persist = true

[[env.staging.ratelimits]]
name = "AUTH_RATE_LIMIT"
namespace_id = "1002"
simple = { limit = 20, period = 60 }
